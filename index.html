<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন - Electronics Shop Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div class="logo">ES</div>
      <h1>Electronics Shop</h1>
      <p>ম্যানেজমেন্ট সিস্টেমে লগইন করুন</p>
    </div>

    <!-- Error / Success Messages -->
    <div id="errorMsg" class="error-msg hidden"></div>
    <div id="successMsg" class="success-msg hidden"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">ইমেইল</label>
        <input type="email" id="email" placeholder="আপনার ইমেইল লিখুন" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary">লগইন</button>

      <div class="form-footer">
        <a href="#" id="forgotPassword" class="btn-link">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>
    </form>

    <!-- Password Reset Form (hidden by default) -->
    <form id="resetForm" class="hidden">
      <div class="form-group">
        <label for="resetEmail">ইমেইল অ্যাড্রেস</label>
        <input type="email" id="resetEmail" placeholder="রেজিস্টার্ড ইমেইল লিখুন" required>
      </div>

      <button type="submit" id="resetBtn" class="btn btn-primary">রিসেট লিংক পাঠান</button>

      <div class="form-footer">
        <a href="#" id="backToLogin" class="btn-link">← লগইনে ফিরে যান</a>
      </div>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
